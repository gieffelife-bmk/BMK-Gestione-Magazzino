<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMK Gestione Magazzino</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#eef5fb,#fff);display:flex;align-items:center;justify-content:center;color:#17324d}
.card{width:min(92%,460px);background:#fff;border-radius:24px;padding:42px 30px;text-align:center;box-shadow:0 18px 50px rgba(23,50,77,.14);border:1px solid #dce8f2}
.logo{width:150px;max-width:70%;height:auto;margin-bottom:24px;object-fit:contain}
.fallback{font-size:34px;font-weight:800;letter-spacing:2px;margin-bottom:24px;color:#1f4e78}
h1{margin:0 0 10px;font-size:28px;color:#1f4e78}
p{margin:0 0 28px;color:#64788a;font-size:16px}
.button{display:inline-block;width:100%;padding:16px 22px;border-radius:14px;background:#1f4e78;color:#fff;text-decoration:none;font-weight:700;font-size:17px}
.footer{margin-top:22px;font-size:12px;color:#91a2b1}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="logo.png" alt="BMK" onerror="this.style.display='none';document.getElementById('fallback').style.display='block';">
<div id="fallback" class="fallback" style="display:none">BMK</div>
<h1>Gestione Magazzino</h1>
<p>Accesso al gestionale BMK</p>
<a class="button" href="https://docs.google.com/spreadsheets/d/1UjB4DJFGo9w-6qHx62ia4AXt_slKc5TSiRI6yW-XlU0/edit?gid=1199062128#gid=1199062128" target="_blank" rel="noopener noreferrer">Apri Gestione Magazzino</a>
<div class="footer">BMK · Gestione Magazzino</div>
</main>
</body>
</html>
