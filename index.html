<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Magazzino</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(1100px, 100%);
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 1080px;
      height: auto;
      margin: 0 auto 28px;
    }

    .button {
      display: block;
      width: min(760px, 90%);
      margin: 0 auto;
      padding: 18px 24px;
      border-radius: 14px;
      background: #176d86;
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .button:hover {
      opacity: .92;
    }
  </style>
</head>
<body>
  <main class="container">
    <img
      class="logo"
      src="MAGAZZINO.png"
      alt="Gestione Magazzino"
    >

    <a
      class="button"
      href="https://docs.google.com/spreadsheets/d/1UjB4DJFGo9w-6qHx62ia4AXt_slKc5TSiRI6yW-XlU0/edit?gid=1199062128#gid=1199062128"
      target="_blank"
      rel="noopener noreferrer"
    >
      APRI GESTIONE MAGAZZINO
    </a>
  </main>
</body>
</html>
