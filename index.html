<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Magazzino BEMEDIKA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #17324d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
    }

    /* Il logo rimane piccolo come nelle altre app:
       180 px di base, massimo 260 px su schermi grandi. */
    .logo {
      width: 180px;
      height: 180px;
      max-width: 260px;
      max-height: 260px;
      object-fit: contain;
      display: block;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #17324d;
    }

    .subtitle {
      margin: 10px 0 28px;
      font-size: 16px;
      color: #6b7d8d;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 360px;
      padding: 15px 28px;
      border-radius: 12px;
      background: #176d86;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(23, 109, 134, 0.20);
    }

    .button:hover {
      opacity: 0.92;
    }

    @media (max-width: 600px) {
      .logo {
        width: 180px;
        height: 180px;
      }

      h1 {
        font-size: 24px;
      }

      .button {
        min-width: 0;
        width: 90%;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- Il file del logo deve chiamarsi esattamente MAGAZZINO.png -->
    <img
      class="logo"
      src="MAGAZZINO.png"
      alt="Gestione Magazzino BEMEDIKA"
    >

    <h1>Gestione Magazzino BEMEDIKA</h1>

    <div class="subtitle">
      Accedi al gestionale di magazzino
    </div>

    <a
      class="button"
      href="https://docs.google.com/spreadsheets/d/1UjB4DJFGo9w-6qHx62ia4AXt_slKc5TSiRI6yW-XlU0/edit?gid=1199062128#gid=1199062128"
      target="_blank"
      rel="noopener noreferrer"
    >
      APRI GESTIONE MAGAZZINO
    </a>

  </main>
</body>
</html>
